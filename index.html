<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Parking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
            max-width: 340px;
            width: 100%;
            border: 1px solid #334155;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn-abrir {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #22c55e, #16a34a);
            color: white;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4);
            transition: all 0.15s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-abrir:active {
            transform: scale(0.94);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        #mensaje {
            margin-top: 25px;
            font-weight: 600;
            font-size: 15px;
            min-height: 24px;
            color: #4ade80;
        }
        iframe {
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Puerta de Parking</h2>
    <p>Pulsa el botón para accionar</p>
    
    <!-- Formulario invisible enviando la orden directamente -->
    <form action="https://shelly-287-eu.shelly.cloud/v2/devices/api/set/switch" method="POST" target="hidden_frame" onsubmit="ordenEnviada()">
        <input type="hidden" name="auth_key" value="NDljZWNldWlkE2DE2D3F5895FDF7F905B584EE616A6ABCB1EB8B3D33A08D34536F84E6F6D8128A8C400AA99712B7">
        <input type="hidden" name="id" value="48f6ee8c07a8">
        <input type="hidden" name="channel" value="0">
        <input type="hidden" name="on" value="true">
        
        <button type="submit" id="boton" class="btn-abrir">ABRIR</button>
    </form>
    
    <div id="mensaje"></div>
</div>

<!-- Marco oculto para recibir la respuesta sin cambiar de página -->
<iframe name="hidden_frame" id="hidden_frame"></iframe>

<script>
    function ordenEnviada() {
        const txt = document.getElementById('mensaje');
        txt.innerText = "✓ Orden enviada a la puerta";
        setTimeout(function() {
            txt.innerText = "";
        }, 4000);
    }
</script>

</body>
</html>
